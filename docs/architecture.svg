<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020617"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">nodesec Architecture</text>
  <text x="600" y="60" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">Cross-platform System & Network Security Platform</text>

  <!-- LAYER 1: INTERFACES -->
  <rect x="40" y="90" width="280" height="120" rx="8" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="180" y="115" fill="white" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">INTERFACES</text>
  <text x="180" y="138" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">CLI (clap + interactive)</text>
  <text x="180" y="156" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">TUI (ratatui/crossterm)</text>
  <text x="180" y="174" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">GUI (Tauri + React/D3.js)</text>
  <text x="180" y="192" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="JetBrains Mono, monospace">Net-Installer (Rust/sh/ps1)</text>

  <!-- LAYER 2: CORE LIBRARY -->
  <rect x="360" y="90" width="480" height="540" rx="8" fill="rgba(6, 78, 59, 0.3)" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="115" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">nodesec-core</text>
  
  <!-- Core components -->
  <rect x="380" y="135" width="220" height="80" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="490" y="155" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Audit Engine</text>
  <text x="490" y="172" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">orchestration • 27 checks</text>
  <text x="490" y="188" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">CVE enrichment (NVD)</text>

  <rect x="620" y="135" width="200" height="80" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="720" y="155" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Network Monitor</text>
  <text x="720" y="172" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Linux/macOS/Windows</text>
  <text x="720" y="188" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Real-time + SIEM mode</text>

  <rect x="380" y="230" width="440" height="80" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="250" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Threat Detector</text>
  <text x="600" y="272" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Rules: dest rarity, frequency, ports, timing, process, geo, patterns</text>
  <text x="600" y="288" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">ML: Isolation Forest (8-dim features)</text>

  <rect x="380" y="325" width="220" height="120" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="490" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Inventory & Logs</text>
  <text x="490" y="367" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Apps: dpkg/rpm/brew/Registry</text>
  <text x="490" y="383" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Processes: temp dirs, injection</text>
  <text x="490" y="399" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Logs: journalctl/eventlog</text>
  <text x="490" y="415" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">AD: LDAP/SMB/SSSD</text>

  <rect x="620" y="325" width="200" height="120" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="720" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Reporting & Remediation</text>
  <text x="720" y="367" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Text/JSON/CSV output</text>
  <text x="720" y="383" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Bash/PowerShell scripts</text>
  <text x="720" y="399" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">ISO27001/HIPAA/PCI-DSS</text>
  <text x="720" y="415" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Desktop export bundle</text>

  <rect x="380" y="460" width="440" height="150" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="480" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">SIEM / Parent-Child Mode</text>
  <text x="600" y="505" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Server: WebSocket aggregation + TLS + custom crypto</text>
  <text x="600" y="525" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Client Agent: Lightweight endpoint monitor</text>
  <text x="600" y="545" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Real-time alerts + historical query API</text>
  <text x="600" y="565" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Rule distribution to agents</text>

  <!-- LAYER 3: PLATFORM ABSTRACTION -->
  <rect x="880" y="90" width="280" height="540" rx="8" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="1020" y="115" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">PLATFORM BACKENDS</text>

  <rect x="895" y="135" width="250" height="150" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="1020" y="155" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Linux</text>
  <text x="1020" y="177" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">/proc/net/tcp + netlink</text>
  <text x="1020" y="193" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">eBPF CO-RE (tcp_connect)</text>
  <text x="1020" y="209" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">ufw/firewalld/nftables</text>
  <text x="1020" y="225" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">systemd + journalctl</text>

  <rect x="895" y="305" width="250" height="150" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="1020" y="325" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">macOS</text>
  <text x="1020" y="347" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">libproc + NetworkExtension</text>
  <text x="1020" y="363" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">netstat/lsof parsing</text>
  <text x="1020" y="379" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">FileVault + firewall</text>
  <text x="1020" y="395" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">log show + system.log</text>

  <rect x="895" y="475" width="250" height="140" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="1020" y="495" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Windows</text>
  <text x="1020" y="517" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">GetExtendedTcpTable</text>
  <text x="1020" y="533" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">ETW (tcp_connect)</text>
  <text x="1020" y="549" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">BitLocker + Defender</text>
  <text x="1020" y="565" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Event Logs (Security/System)</text>

  <!-- ARROWS: Interfaces → Core -->
  <line x1="320" y1="150" x2="360" y2="150" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="230" x2="360" y2="230" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- ARROWS: Core → Platform -->
  <line x1="840" y1="200" x2="895" y2="200" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="840" y1="370" x2="895" y2="370" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="840" y1="540" x2="895" y2="540" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- LEGEND -->
  <text x="40" y="670" fill="white" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Legend:</text>
  <rect x="120" y="660" width="20" height="12" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="148" y="670" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Interfaces</text>
  <rect x="260" y="660" width="20" height="12" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="288" y="670" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Core Library</text>
  <rect x="420" y="660" width="20" height="12" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="448" y="670" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">SIEM Mode</text>
  <rect x="570" y="660" width="20" height="12" rx="2" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="598" y="670" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Platform Backends</text>
  <line x1="720" y1="666" x2="740" y2="666" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="750" y="670" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Dependency Flow</text>
</svg>