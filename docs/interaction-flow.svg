<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <text x="500" y="40" fill="#22d3ee" font-size="20" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">nodesec User Interaction Flow</text>
  <text x="500" y="60" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="JetBrains Mono, monospace">How users interact with the platform</text>

  <!-- ENTRY POINT -->
  <rect x="380" y="90" width="240" height="60" rx="30" fill="rgba(8, 51, 68, 0.5)" stroke="#22d3ee" stroke-width="2"/>
  <text x="500" y="120" fill="white" font-size="14" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">nodesec</text>
  <text x="500" y="140" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">Main Binary Entry</text>

  <!-- MODE SELECTION -->
  <line x1="500" y1="150" x2="500" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="320" y="180" width="360" height="50" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="210" fill="white" font-size="13" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">MODE SELECTION:  net  |  audit  |  report  |  config</text>

  <!-- THREE BRANCHES -->
  <line x1="320" y1="205" x2="180" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="205" x2="500" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="205" x2="820" y2="250" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- NETWORK MODE (LEFT) -->
  <rect x="40" y="250" width="280" height="420" rx="8" fill="rgba(8, 51, 68, 0.3)" stroke="#22d3ee" stroke-width="2"/>
  <text x="180" y="280" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">net MODE</text>
  <text x="180" y="305" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">Real-time Network Monitoring</text>

  <rect x="55" y="320" width="250" height="60" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">live</text>
  <text x="180" y="365" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">On-device real-time</text>

  <rect x="55" y="400" width="250" height="60" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="425" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">server</text>
  <text x="180" y="445" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">SIEM WebSocket server</text>

  <rect x="55" y="480" width="250" height="60" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="505" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">agents</text>
  <text x="180" y="525" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Manage endpoints</text>

  <rect x="55" y="560" width="250" height="50" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="1"/>
  <text x="180" y="585" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">rules</text>
  <text x="180" y="605" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Custom detection rules</text>

  <line x1="180" y1="620" x2="180" y2="650" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="80" y="650" width="200" height="40" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="2"/>
  <text x="180" y="675" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Launch TUI / GUI</text>

  <!-- AUDIT MODE (CENTER) -->
  <rect x="360" y="250" width="280" height="460" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="280" fill="#34d399" font-size="13" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">audit MODE</text>
  <text x="500" y="305" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">Static Security Audit</text>

  <rect x="375" y="320" width="250" height="70" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="500" y="345" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">run --interactive</text>
  <text x="500" y="365" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Prompt-driven wizard</text>
  <text x="500" y="380" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Platform • CVE • Apps • Logs • AD</text>

  <rect x="375" y="410" width="250" height="70" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="500" y="435" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">run --flags</text>
  <text x="500" y="455" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Automated CI/CD mode</text>
  <text x="500" y="470" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">--target-os --format --include-cves</text>

  <rect x="375" y="500" width="250" height="70" rx="6" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="500" y="525" fill="#fb7185" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">tui / gui flags</text>
  <text x="500" y="545" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">--tui or --gui</text>

  <line x1="500" y1="580" x2="500" y2="610" stroke="#34d399" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="400" y="610" width="200" height="40" rx="6" fill="rgba(6, 78, 59, 0.5)" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="635" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Reports: txt/json/csv</text>

  <line x1="500" y1="650" x2="500" y2="680" stroke="#34d399" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="400" y="680" width="200" height="40" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="2"/>
  <text x="500" y="705" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Remediation Script</text>

  <!-- REPORT/CONFIG MODE (RIGHT) -->
  <rect x="680" y="250" width="280" height="380" rx="8" fill="rgba(76, 29, 149, 0.3)" stroke="#a78bfa" stroke-width="2"/>
  <text x="820" y="280" fill="#a78bfa" font-size="13" font-weight="700" text-anchor="middle" font-family="JetBrains Mono, monospace">report / config MODE</text>

  <rect x="695" y="310" width="250" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="820" y="335" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">report list</text>
  <text x="820" y="355" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Browse all reports</text>

  <rect x="695" y="390" width="250" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="820" y="415" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">report view <id></text>
  <text x="820" y="435" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">Text/JSON/CSV format</text>

  <rect x="695" y="470" width="250" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="820" y="495" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">config</text>
  <text x="820" y="515" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono, monospace">~/.config/nodesec/config.toml</text>

  <line x1="820" y1="540" x2="820" y2="570" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="720" y="570" width="200" height="40" rx="6" fill="rgba(76, 29, 149, 0.5)" stroke="#a78bfa" stroke-width="2"/>
  <text x="820" y="595" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">Settings Updated</text>

  <!-- INSTALLER FLOW (BOTTOM) -->
  <line x1="500" y1="720" x2="500" y2="750" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="300" y="750" width="400" height="40" rx="6" fill="rgba(120, 53, 15, 0.4)" stroke="#fbbf24" stroke-width="2"/>
  <text x="500" y="775" fill="#fbbf24" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono, monospace">curl install.sh | bash  •  iwr install.ps1 | iex</text>

  <!-- FEEDBACK LOOPS -->
  <path d="M 180 250 Q 100 200 100 150 Q 180 100 320 150 Q 460 200 320 250" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="100" y="170" fill="#22d3ee" font-size="8" font-family="JetBrains Mono, monospace">Switch modes</text>

  <path d="M 820 250 Q 900 200 900 150 Q 820 100 680 150 Q 540 200 680 250" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="900" y="170" fill="#a78bfa" font-size="8" font-family="JetBrains Mono, monospace">View reports</text>

  <!-- LEGEND -->
  <text x="40" y="780" fill="white" font-size="11" font-weight="600" font-family="JetBrains Mono, monospace">Legend:</text>
  <rect x="120" y="770" width="20" height="12" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="148" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Network Mode</text>
  <rect x="280" y="770" width="20" height="12" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="308" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Audit Mode</text>
  <rect x="440" y="770" width="20" height="12" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="468" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Report/Config</text>
  <rect x="600" y="770" width="20" height="12" rx="2" fill="rgba(136, 19, 55, 0.3)" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="628" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Interactive Flow</text>
  <line x1="760" y1="776" x2="780" y2="776" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="790" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Main Flow</text>
  <line x1="880" y1="776" x2="900" y2="776" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="910" y="780" fill="#94a3b8" font-size="10" font-family="JetBrains Mono, monospace">Installer</text>
</svg>