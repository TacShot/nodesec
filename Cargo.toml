[workspace]
resolver = "2"
members = ["nodesec-core", "nodesec-cli", "nodesec-tui", "nodesec-gui", "nodesec", "installer"]
exclude = ["target"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "nodesec - Cross-platform System & Network Security Platform"
authors = ["Sarthak Sharma"]
repository = "https://github.com/TacShot/nodesec"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4", "fast-rng"] }
semver = "1.0"

# Async & HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "net"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
console = "0.15"
indicatif = "0.17"
colored = "2.0"

# TUI
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = "0.28"

# GUI - Tauri
tauri = { version = "2.0", features = ["default"] }

# Platform detection & process info
sysinfo = "0.33"
which = "5.0"
dirs = "5.0"

# Network monitoring
socket2 = "0.5"
async-trait = "0.1"

# Threat detection & ML
linfa = { version = "0.7", features = ["default"] }
smartcore = { version = "0.4", features = ["default"] }
ndarray = "0.16"
maxminddb = "0.12"
ipnetwork = "0.21"

# Crypto for parent-child mode
ring = "0.17"
rsa = { version = "0.9", features = ["default"] }
rand = { version = "0.8", features = ["std"] }
zeroize = "1.8"

# Testing
tempfile = "3.0"
predicates = "3.0"
assert_cmd = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1