[package]
name = "nodesec-net-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Network monitoring server for nodesec (client-server mode)"
repository = { workspace = true }

[dependencies]
nodesec-core = { path = "../nodesec-core" }
axum = { version = "0.7", features = ["ws", "tokio", "macros"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tower = { version = "0.4", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }